version: 2
updates:
  - package-ecosystem: pip
    directory: /backend_api_python
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python-runtime:
        patterns: ["*"]
    ignore:
      - dependency-name: redis
        update-types: ["version-update:semver-major"]

  - package-ecosystem: pip
    directory: /mcp_server
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      mcp-python:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      codeql-actions:
        patterns: ["github/codeql-action/*"]

  - package-ecosystem: docker
    directory: /backend_api_python
    schedule:
      interval: weekly
    open-pull-requests-limit: 3

  - package-ecosystem: docker
    directory: /mcp_server
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
